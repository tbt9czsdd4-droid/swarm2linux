[workspace]
members = ["crates/race-hid", "crates/tb-proto", "crates/stealth-dbus", "crates/stealthctl", "crates/stealthd", "crates/stealth-gui"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
race-hid = { path = "crates/race-hid" }
tb-proto = { path = "crates/tb-proto" }
stealth-dbus = { path = "crates/stealth-dbus" }
zbus = "5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
